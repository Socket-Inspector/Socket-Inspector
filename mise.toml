[tools]
bun = "1.3.5"
jq = "1.8.2"
node = "24.12.0"
pnpm = "12.10.1"
shellcheck = "0.11.0"

[tasks.setup]
description = "Prepare development environment"
run = ["mise install", "pnpm install --frozen-lockfile", "pnpm --filter playwright-tests install-browsers"]

[tasks."lint:shell"]
description = "Lint shell scripts"
run = "shellcheck shell-scripts/*.sh"
